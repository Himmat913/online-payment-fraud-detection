# Visual system from the "Alliatus – Mastermind Landing Page" Figma template:
# warm-yellow feature panels, charcoal ink, white cards on a light grey canvas,
# Playfair Display headlines and Work Sans for everything else.
# Widget styling comes from here; ui/styles.css only handles layout and the
# custom HTML blocks.

[theme]
base = "light"
primaryColor = "#303030"
backgroundColor = "#F6F6F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#303030"
borderColor = "#DEDBD3"
showWidgetBorder = true
linkColor = "#303030"
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
font = "Work Sans:https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300..700;1,400..600&display=swap"
headingFont = "Playfair Display:https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
headingFontWeights = 400
dataframeHeaderBackgroundColor = "#F6F6F6"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
headless = true

[browser]
gatherUsageStats = false
